# ==========================================================
#  Gym-Bro - Configuracion del backend
# ==========================================================
# Este archivo se sube al repositorio publico.
# Por eso NINGUNA contrasena real esta escrita aqui.
#
# El formato ${VARIABLE:valor_por_defecto} significa:
#   "usa la variable de entorno VARIABLE;
#    si no existe, usa valor_por_defecto"
# ==========================================================

spring.application.name=gym-bro-backend


# ----------------------------------------------------------
#  Conexion a PostgreSQL
# ----------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gymbro}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:gymbro}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones (Hikari). Valores modestos: es desarrollo local.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.pool-name=GymBroPool


# ----------------------------------------------------------
#  JPA / Hibernate
# ----------------------------------------------------------
# validate = Hibernate NO crea ni modifica tablas.
# Solo verifica que las entidades coincidan con lo que existe.
# Quien crea las tablas es Flyway. Nunca poner "update" aqui.
spring.jpa.hibernate.ddl-auto=validate

# No mantener la sesion de base de datos abierta durante toda
# la peticion HTTP. Evita consultas ocultas y fugas de memoria.
spring.jpa.open-in-view=false

# Mostrar el SQL que ejecuta Hibernate, formateado y legible.
# Util mientras aprendemos. Se apaga en produccion.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Agrupar inserciones y actualizaciones en lotes.
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


# ----------------------------------------------------------
#  Flyway - control de versiones de la base de datos
# ----------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# No fallar si todavia no existe ninguna migracion escrita.
# Se puede quitar cuando ya exista V1__esquema_base.sql
spring.flyway.fail-on-missing-locations=false

# La base debe estar vacia la primera vez. Si Flyway encuentra
# tablas que el no creo, se detiene en vez de romper algo.
spring.flyway.baseline-on-migrate=false


# ----------------------------------------------------------
#  Servidor web
# ----------------------------------------------------------
server.port=8080

# Devolver mensajes de error legibles durante el desarrollo.
server.error.include-message=always
server.error.include-binding-errors=always


# ----------------------------------------------------------
#  Actuator - endpoints de diagnostico
# ----------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


# ----------------------------------------------------------
#  Logs
# ----------------------------------------------------------
logging.level.root=INFO
logging.level.com.gymbro.backend=DEBUG
logging.level.org.flywaydb=INFO

# Ver los valores que Hibernate envia a la base de datos.
# Descomentar solo cuando se este depurando una consulta.
# logging.level.org.hibernate.orm.jdbc.bind=TRACE